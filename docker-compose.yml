name: privacy-preserving-cdss

services:
  ollama:
    image: ollama/ollama:latest
    container_name: cdss-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cdss-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdss}
      POSTGRES_USER: ${POSTGRES_USER:-cdss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdss}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  patient-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdss-patient-mcp
    command: uvicorn patient_mcp.app:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    environment:
      PATIENT_MCP_URL: http://patient-mcp:8005
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - .:/app
      - patient_dataset_data:/app/datasets
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8005/docs >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  rule-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdss-rule-engine
    command: uvicorn rule_engine.app:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    environment:
      RULE_ENGINE_URL: http://rule-engine:8004
      KNOWLEDGE_MCP_URL: http://knowledge-mcp:8010
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - .:/app
    depends_on:
      - knowledge-mcp
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8004/docs >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  privacy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdss-privacy-mcp
    command: uvicorn privacy_mcp.app:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      PRIVACY_MCP_URL: http://privacy-mcp:8003
      ZKP_ENGINE_PATH: /app/zkp_engine/target/release/zkp_engine
    volumes:
      - .:/app
      - zkp_target:/app/zkp_engine/target
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8003/docs >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  decision-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdss-decision-engine
    command: uvicorn decision_engine.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      DECISION_ENGINE_URL: http://decision-engine:8002
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/docs >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  knowledge-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdss-knowledge-mcp
    command: uvicorn knowledge_mcp.app:app --host 0.0.0.0 --port 8010
    ports:
      - "8010:8010"
    environment:
      KNOWLEDGE_MCP_URL: http://knowledge-mcp:8010
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - .:/app
      - knowledge_chroma_data:/app/knowledge_mcp/chroma_db
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/docs >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  langgraph-coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdss-langgraph
    command: uvicorn langgraph_coordinator.app:app --host 0.0.0.0 --port 8007
    ports:
      - "8007:8007"
    environment:
      PATIENT_MCP_URL: http://patient-mcp:8005
      RULE_ENGINE_URL: http://rule-engine:8004
      PRIVACY_MCP_URL: http://privacy-mcp:8003
      DECISION_ENGINE_URL: http://decision-engine:8002
      LANGGRAPH_URL: http://langgraph-coordinator:8007
    volumes:
      - .:/app
    depends_on:
      - patient-mcp
      - rule-engine
      - privacy-mcp
      - decision-engine
      - knowledge-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8007/docs >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  doctor-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdss-doctor-console
    command: python doctor_console.py
    environment:
      LANGGRAPH_URL: http://langgraph-coordinator:8007
    volumes:
      - .:/app
    depends_on:
      - langgraph-coordinator
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
  patient_dataset_data:
  knowledge_chroma_data:
  zkp_target:
